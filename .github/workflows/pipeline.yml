name: Auto Shorts Pipeline

on:
  schedule:
    - cron: '0 13 * * *'  # 15:00 CEST / 09:00 EDT — morning US
    - cron: '0 17 * * *'  # 19:00 CEST / 13:00 EDT — lunch US
    - cron: '0 21 * * *'  # 23:00 CEST / 17:00 EDT — after-work US
  workflow_dispatch:        # manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Google Sheets token
        run: echo '${{ secrets.GOOGLE_SHEETS_TOKEN_JSON }}' > config/sheets_token.json

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY:          ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY:             ${{ secrets.OPENAI_API_KEY }}
          CREATOMATE_API_KEY:         ${{ secrets.CREATOMATE_API_KEY }}
          CREATOMATE_TEMPLATE_ID:     ${{ secrets.CREATOMATE_TEMPLATE_ID }}
          YOUTUBE_CLIENT_ID:          ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET:      ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN:      ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GOOGLE_SHEET_ID:            ${{ secrets.GOOGLE_SHEET_ID }}
          PEXELS_API_KEY:             ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN:         ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:           ${{ secrets.TELEGRAM_CHAT_ID }}
          FACEBOOK_PAGE_ID:           ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: python main.py --now

      - name: Save state (used topics + analytics queue)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/used_topics.json data/analytics_pending.json
          git diff --staged --quiet || git commit -m "chore: update pipeline state [skip ci]"
          git push
